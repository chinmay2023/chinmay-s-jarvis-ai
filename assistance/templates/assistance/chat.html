<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Core Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #050811;
            color: #00f0ff;
            overflow: hidden;
            position: relative;
        }

        .stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            padding: 20px 15px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        /* Header Status */
        .header-status {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: blinkGlow 1.5s infinite alternate ease-in-out;
            flex-shrink: 0;
        }

        @keyframes blinkGlow {
            0% { opacity: 0.3; box-shadow: 0 0 2px #00f0ff; }
            100% { opacity: 1; box-shadow: 0 0 14px #00f0ff, 0 0 22px #00f0ff; }
        }

        /* Top Right Logout Button */
        .logout-form {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .logout-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        /* Central HUD Node */
        .core-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 50%;
            animation: rotateClockwise 20s linear infinite;
        }

        .inner-ring {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid rgba(0, 240, 255, 0.15);
            border-top: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            border-radius: 50%;
            animation: rotateCounter 10s linear infinite;
        }

        .center-node {
            width: 50%;
            height: 50%;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff 0%, #004466 70%, #050811 100%);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-wrapper.listening .center-node {
            transform: scale(1.12);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.8);
            background: radial-gradient(circle, #00f0ff 0%, #0088cc 60%, #050811 100%);
        }

        .core-wrapper.speaking .center-node {
            animation: pulseWave 1s infinite alternate ease-in-out;
            box-shadow: 0 0 80px rgba(0, 240, 255, 0.9);
        }

        .core-wrapper.thinking .inner-ring {
            animation: rotateCounter 2s linear infinite;
            border-color: #00f0ff;
        }

        /* Subtitle Box */
        .subtitle-box {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            text-align: center;
            font-size: 0.95rem;
            color: #d1f7ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            padding: 0 15px;
            z-index: 2;
            min-height: 40px;
        }

        @keyframes rotateClockwise { 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pulseWave {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.12); }
        }

        /* Responsive Mobile Layout Adjustments */
        @media (max-width: 768px) {
            .header-status {
                top: 18px;
                left: 15px;
                transform: none;
                font-size: 0.65rem;
                letter-spacing: 0.5px;
                max-width: calc(100vw - 110px);
            }

            #statusText {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
            }

            .logout-form {
                top: 12px;
                right: 12px;
            }

            .logout-btn {
                padding: 6px 12px;
                font-size: 0.6rem;
            }

            .core-wrapper {
                width: 200px;
                height: 200px;
            }

            .subtitle-box {
                bottom: 80px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="stage-container">
        <div class="header-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Initializing...</span>
        </div>

        <form action="{% url 'assistance:logout' %}" method="POST" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>

        <div class="core-wrapper" id="coreWrapper" onclick="toggleSession()">
            <div class="outer-ring"></div>
            <div class="inner-ring"></div>
            <div class="center-node"></div>
        </div>

        <div class="subtitle-box" id="subtitleBox"></div>
    </div>

    <script>
        const coreWrapper = document.getElementById('coreWrapper');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const subtitleBox = document.getElementById('subtitleBox');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let sessionActive = false;
        let isProcessingOrSpeaking = false;

        let accumulatedTranscript = '';
        let speechTimeout = null;
        let currentAudio = null;

        // Device Check
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let audioContext = null;
        let analyser = null;
        let micStream = null;
        let lastClapTime = 0;
        let clapCount = 0;

        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        // Set initial display text
        statusText.textContent = isMobile 
            ? "Tap Core to Activate JARVIS" 
            : "Double-Clap or Click Core to Activate";

        // --- 1. CLAP DETECTOR (Desktop / Laptop Only) ---
        async function initClapDetector() {
            if (isMobile || sessionActive) return; // Completely disabled on mobile to prevent hardware locks

            if (audioContext) {
                if (audioContext.state === 'suspended') await audioContext.resume();
                return;
            }

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.fftSize);
                statusText.textContent = "Clap Detection Active | Double-Clap or Click Core";

                function monitorAudio() {
                    if (!sessionActive && !isProcessingOrSpeaking && audioContext && audioContext.state === 'running') {
                        analyser.getByteTimeDomainData(dataArray);

                        let maxPeak = 0;
                        for (let i = 0; i < dataArray.length; i++) {
                            const deviation = Math.abs(dataArray[i] - 128);
                            if (deviation > maxPeak) maxPeak = deviation;
                        }

                        if (maxPeak > 45) {
                            const now = Date.now();
                            if (now - lastClapTime > 150) {
                                lastClapTime = now;
                                clapCount++;

                                if (clapCount === 1) {
                                    statusText.textContent = "Clap 1 Detected...";
                                    setTimeout(() => {
                                        if (clapCount === 1) {
                                            clapCount = 0;
                                            statusText.textContent = sessionActive ? "Listening..." : "Double-Clap or Click Core to Activate";
                                        }
                                    }, 1200);
                                } else if (clapCount >= 2) {
                                    clapCount = 0;
                                    statusText.textContent = "⚡ Double Clap Detected! Activating...";
                                    if (!sessionActive) toggleSession();
                                }
                            }
                        }
                    }
                    requestAnimationFrame(monitorAudio);
                }
                monitorAudio();
            } catch (err) {
                console.warn("Clap detector notice:", err);
                statusText.textContent = "Click Core to Activate";
            }
        }

        // --- 2. HYBRID SPEECH RECOGNITION ---
        function setupSpeechRecognition() {
            if (!SpeechRecognition) {
                statusText.textContent = "Speech Recognition not supported in this browser.";
                return;
            }

            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            // Continuous on laptop for hands-free chat; phrase-looping on mobile for stability
            recognition.continuous = !isMobile;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                if (!sessionActive) {
                    try { recognition.stop(); } catch(e){}
                    return;
                }
                coreWrapper.className = 'core-wrapper listening';
                statusText.textContent = "Listening... (Speak to JARVIS)";
            };

            recognition.onresult = (event) => {
                if (!sessionActive || isProcessingOrSpeaking) return;

                let interim = '';
                let hasFinal = false;

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        accumulatedTranscript += text + ' ';
                        hasFinal = true;
                    } else {
                        interim += text;
                    }
                }

                const liveText = (accumulatedTranscript + interim).trim();
                if (liveText.length > 0) {
                    subtitleBox.textContent = `You: "${liveText}"`;
                }

                clearTimeout(speechTimeout);
                if (liveText.length > 1) {
                    const waitTime = hasFinal ? 1000 : 1600;
                    speechTimeout = setTimeout(() => {
                        if (sessionActive && !isProcessingOrSpeaking && accumulatedTranscript.trim().length > 1) {
                            const query = accumulatedTranscript.trim();
                            accumulatedTranscript = '';
                            sendToJarvis(query);
                        }
                    }, waitTime);
                }
            };

            recognition.onerror = (event) => {
                console.warn("Speech Recognition notice:", event.error);
                if (event.error === 'not-allowed') {
                    statusText.textContent = "Mic permission denied. Please allow mic in browser.";
                    sessionActive = false;
                    resetUI();
                } else if (event.error !== 'no-speech' && sessionActive && !isProcessingOrSpeaking) {
                    restartListeningWithDelay();
                }
            };

            recognition.onend = () => {
                if (sessionActive && !isProcessingOrSpeaking) {
                    const finalQuery = accumulatedTranscript.trim();
                    if (finalQuery.length > 1) {
                        accumulatedTranscript = '';
                        sendToJarvis(finalQuery);
                    } else {
                        restartListeningWithDelay();
                    }
                }
            };
        }

        // --- 3. SESSION MANAGEMENT ---
        function toggleSession() {
            if (!sessionActive) {
                sessionActive = true;
                isProcessingOrSpeaking = true;
                accumulatedTranscript = '';

                setupSpeechRecognition();

                const rawSalutation = "{{ salutation|escapejs }}";
                const salutation = decodeHTML(rawSalutation) || "sir";
                const wakeGreeting = `Online and ready, ${salutation}.`;

                subtitleBox.textContent = `JARVIS: "${wakeGreeting}"`;
                fetchWakeAudio(wakeGreeting);
            } else {
                shutdownSession();
            }
        }

        function fetchWakeAudio(text) {
            const formData = new FormData();
            formData.append('message', '__WAKE_GREETING__');
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'assistance:jarvis_api' %}", {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.audio) {
                    speakReply(data.reply, data.audio, false);
                } else {
                    speakReply(text, null, false);
                }
            })
            .catch(() => {
                speakReply(text, null, false);
            });
        }

        function shutdownSession() {
            sessionActive = false;
            isProcessingOrSpeaking = false;
            accumulatedTranscript = '';
            clearTimeout(speechTimeout);

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            resetUI();
            statusText.textContent = isMobile 
                ? "Systems Offline. Tap Core to Activate." 
                : "Systems Offline. Double-Clap or Click Core to Activate.";
        }

        function startListening() {
            if (!sessionActive || isProcessingOrSpeaking) return;
            accumulatedTranscript = '';
            try {
                if (!recognition) setupSpeechRecognition();
                recognition.start();
            } catch (e) {
                try { recognition.stop(); } catch (err) {}
                setTimeout(() => { 
                    if (sessionActive && !isProcessingOrSpeaking) {
                        try { recognition.start(); } catch(err2) {}
                    }
                }, 200);
            }
        }

        function restartListeningWithDelay() {
            if (!sessionActive || isProcessingOrSpeaking) return;
            setTimeout(() => { startListening(); }, 250);
        }

        function resetUI() {
            coreWrapper.className = 'core-wrapper';
            statusText.textContent = sessionActive ? "Listening..." : (isMobile ? "Systems Offline. Tap Core to Activate." : "Systems Offline. Double-Clap or Click Core to Activate.");
            
            setTimeout(() => {
                if (!isProcessingOrSpeaking && !sessionActive) subtitleBox.textContent = "";
            }, 3000);
        }

        function sendToJarvis(message) {
            if (!sessionActive) return;

            isProcessingOrSpeaking = true;
            clearTimeout(speechTimeout);

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            coreWrapper.className = 'core-wrapper thinking';
            statusText.textContent = "JARVIS Thinking...";

            const formData = new FormData();
            formData.append('message', message);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'assistance:jarvis_api' %}", {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.reply) {
                    const cleanReply = decodeHTML(data.reply);
                    subtitleBox.textContent = `JARVIS: "${cleanReply}"`;
                    speakReply(cleanReply, data.audio || null, data.shutdown || false);
                } else {
                    isProcessingOrSpeaking = false;
                    restartListeningWithDelay();
                }
            })
            .catch(err => {
                console.error('API Error:', err);
                isProcessingOrSpeaking = false;
                if (sessionActive) restartListeningWithDelay();
            });
        }

        function speakReply(text, base64Audio = null, isShutdown = false) {
            const cleanText = decodeHTML(text).replace(/[*_~#`]/g, '').trim();

            if (base64Audio) {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                currentAudio = new Audio("data:audio/mp3;base64," + base64Audio);
                
                coreWrapper.className = 'core-wrapper speaking';
                statusText.textContent = isShutdown ? "JARVIS Shutting Down..." : "JARVIS Transmitting...";

                currentAudio.play().catch(e => {
                    console.warn("Audio playback issue:", e);
                });

                currentAudio.onended = () => {
                    currentAudio = null;
                    if (isShutdown) {
                        shutdownSession();
                    } else {
                        setTimeout(() => {
                            isProcessingOrSpeaking = false;
                            if (sessionActive) {
                                resetUI();
                                startListening();
                            } else {
                                resetUI();
                            }
                        }, 250);
                    }
                };

                currentAudio.onerror = () => {
                    currentAudio = null;
                    isProcessingOrSpeaking = false;
                    if (sessionActive) restartListeningWithDelay();
                };
                return;
            }

            isProcessingOrSpeaking = false;
            if (sessionActive) restartListeningWithDelay();
        }

        // On laptop, initiate clap listener on first interaction
        window.addEventListener('click', () => {
            if (!isMobile) initClapDetector();
        }, { once: true });
    </script>
</body>
</html>
