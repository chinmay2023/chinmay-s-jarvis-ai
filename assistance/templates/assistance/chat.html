{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Core Interface</title>

    <!-- JARVIS JPG Favicon -->
    <link rel="icon" type="image/jpeg" href="{% static 'assistance/image/Jarvis.jpg' %}">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #050811;
            color: #00f0ff;
            overflow: hidden;
            position: relative;
        }

        .stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            padding: 20px 15px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        /* Top Controls */
        .top-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .hud-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .hud-btn:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        /* Locked state when JARVIS is offline */
        .hud-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: rgba(0, 240, 255, 0.15);
            box-shadow: none;
            background: rgba(0, 240, 255, 0.02);
            color: rgba(0, 240, 255, 0.4);
        }

        /* Task Tray (Top-Left) */
        .task-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(5, 8, 17, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 260px;
            display: none;
        }

        .task-panel.visible {
            display: block;
        }

        .task-header {
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 4px;
        }

        .task-list {
            list-style: none;
            font-size: 0.78rem;
            color: #d1f7ff;
        }

        .task-list li {
            margin: 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Header Status */
        .header-status {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1.5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            animation: blinkGlow 1.5s infinite alternate ease-in-out;
            flex-shrink: 0;
        }

        @keyframes blinkGlow {
            0% { opacity: 0.3; box-shadow: 0 0 2px #00f0ff; }
            100% { opacity: 1; box-shadow: 0 0 14px #00f0ff, 0 0 22px #00f0ff; }
        }

        /* Central HUD Node */
        .core-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 240, 255, 0.3);
            border-radius: 50%;
            animation: rotateClockwise 20s linear infinite;
        }

        .inner-ring {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid rgba(0, 240, 255, 0.15);
            border-top: 2px solid #00f0ff;
            border-bottom: 2px solid #00f0ff;
            border-radius: 50%;
            animation: rotateCounter 10s linear infinite;
        }

        .center-node {
            width: 50%;
            height: 50%;
            border-radius: 50%;
            background: #050811 url("{% static 'assistance/image/Jarvis.jpg' %}") center/cover no-repeat;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-wrapper.listening .center-node {
            transform: scale(1.12);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.8);
        }

        .core-wrapper.speaking .center-node {
            animation: pulseWave 1s infinite alternate ease-in-out;
            box-shadow: 0 0 80px rgba(0, 240, 255, 0.9);
        }

        .core-wrapper.thinking .inner-ring {
            animation: rotateCounter 2s linear infinite;
            border-color: #00f0ff;
        }

        /* Subtitle Box */
        .subtitle-box {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            text-align: center;
            font-size: 0.95rem;
            color: #d1f7ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            padding: 0 15px;
            z-index: 2;
            min-height: 40px;
        }

        @keyframes rotateClockwise { 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pulseWave {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.12); }
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            .top-nav {
                top: 14px;
                right: 14px;
                gap: 6px;
            }

            .task-panel {
                top: 90px;
                left: 14px;
                max-width: 220px;
            }

            .header-status {
                top: 56px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 0.72rem;
                letter-spacing: 0.8px;
                width: 90%;
                justify-content: center;
            }

            #statusText {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                text-align: center;
            }

            .hud-btn {
                padding: 6px 11px;
                font-size: 0.65rem;
                letter-spacing: 1px;
            }

            .core-wrapper {
                width: 210px;
                height: 210px;
            }

            .subtitle-box {
                bottom: 80px;
                font-size: 0.85rem;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>

    <div class="stage-container" id="stageContainer">
        <!-- Top Left Task Overlay -->
        <div class="task-panel" id="taskPanel">
            <div class="task-header">Pending Directives</div>
            <ul class="task-list" id="taskList">
                {% if tasks %}
                    {% for task in tasks %}
                        <li>• {{ task.title }}</li>
                    {% endfor %}
                {% else %}
                    <li>No active directives</li>
                {% endif %}
            </ul>
        </div>

        <!-- Top Right Actions -->
        <div class="top-nav" id="topNav">
            <button type="button" class="hud-btn" id="taskBtn" onclick="toggleTaskPanel(event)" disabled>Tasks</button>
            <button type="button" class="hud-btn" id="purgeBtn" onclick="clearMemory(event)" disabled>Purge</button>
            <a href="{% url 'assistance:logout' %}" class="hud-btn">Logout</a>
        </div>

        <!-- Centered Status Indicator -->
        <div class="header-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Initializing...</span>
        </div>

        <div class="core-wrapper" id="coreWrapper" onclick="toggleSession(event)">
            <div class="outer-ring"></div>
            <div class="inner-ring"></div>
            <div class="center-node"></div>
        </div>

        <div class="subtitle-box" id="subtitleBox"></div>
    </div>

    <script>
        const coreWrapper = document.getElementById('coreWrapper');
        const statusText = document.getElementById('statusText');
        const subtitleBox = document.getElementById('subtitleBox');
        const taskPanel = document.getElementById('taskPanel');
        const taskList = document.getElementById('taskList');
        const taskBtn = document.getElementById('taskBtn');
        const purgeBtn = document.getElementById('purgeBtn');
        const stageContainer = document.getElementById('stageContainer');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let sessionActive = false;
        let isProcessingOrSpeaking = false;

        let accumulatedTranscript = '';
        let speechTimeout = null;

        // Persistent Audio instance for mobile autoplay
        const jarvisAudio = new Audio();
        let isAudioUnlocked = false;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let audioContext = null;
        let analyser = null;
        let micStream = null;
        let lastClapTime = 0;
        let clapCount = 0;

        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        statusText.textContent = isMobile 
            ? "Tap Core to Activate JARVIS" 
            : "Double-Clap or Click Core to Activate";

        // Mobile Browser AudioContext & Autoplay Unblocker
        function unlockAudioEngine() {
            if (isAudioUnlocked) return;
            jarvisAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            jarvisAudio.play().then(() => {
                jarvisAudio.pause();
                isAudioUnlocked = true;
                console.log("🔊 Mobile Audio Autoplay Unlocked");
            }).catch(() => {});
        }

        document.addEventListener('touchstart', unlockAudioEngine, { once: true });
        document.addEventListener('click', unlockAudioEngine, { once: true });

        // Enables or disables Tasks & Purge controls
        function updateControlsState(active) {
            taskBtn.disabled = !active;
            purgeBtn.disabled = !active;
            if (!active) {
                taskPanel.classList.remove('visible');
            }
        }

        function toggleTaskPanel(e) {
            if (e) e.stopPropagation();
            if (!sessionActive) return;
            taskPanel.classList.toggle('visible');
            refreshTaskList();
        }

        function refreshTaskList() {
            fetch("{% url 'assistance:get_tasks' %}")
                .then(res => res.json())
                .then(data => {
                    if (data.tasks && data.tasks.length > 0) {
                        taskList.innerHTML = data.tasks
                            .filter(t => !t.is_completed)
                            .slice(0, 5)
                            .map(t => `<li>• ${t.title}</li>`)
                            .join('') || '<li>No active directives</li>';
                    } else {
                        taskList.innerHTML = '<li>No active directives</li>';
                    }
                })
                .catch(() => {});
        }

        function clearMemory(e) {
            if (e) e.stopPropagation();
            if (!sessionActive) return;

            if (confirm("Purge recent conversation logs?")) {
                const formData = new FormData();
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');
                fetch("{% url 'assistance:clear_history' %}", {
                    method: 'POST',
                    body: formData
                }).then(() => {
                    subtitleBox.textContent = "Memory buffers cleared.";
                    setTimeout(() => { 
                        if (sessionActive) subtitleBox.textContent = ""; 
                    }, 2500);
                });
            }
        }

        // 1. CLAP DETECTION
        async function initClapDetector() {
            if (isMobile || sessionActive) return;

            if (audioContext) {
                if (audioContext.state === 'suspended') await audioContext.resume();
                return;
            }

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.fftSize);

                function monitorAudio() {
                    if (!sessionActive && !isProcessingOrSpeaking && audioContext && audioContext.state === 'running') {
                        analyser.getByteTimeDomainData(dataArray);

                        let maxPeak = 0;
                        for (let i = 0; i < dataArray.length; i++) {
                            const deviation = Math.abs(dataArray[i] - 128);
                            if (deviation > maxPeak) maxPeak = deviation;
                        }

                        if (maxPeak > 42) {
                            const now = Date.now();
                            const timeSinceLast = now - lastClapTime;

                            if (timeSinceLast > 80 && timeSinceLast < 480) {
                                clapCount = 0;
                                lastClapTime = 0;
                                statusText.textContent = "⚡ Double Clap! Initializing...";
                                if (!sessionActive) toggleSession();
                            } else {
                                lastClapTime = now;
                                clapCount = 1;
                            }
                        }
                    }
                    requestAnimationFrame(monitorAudio);
                }
                monitorAudio();
            } catch (err) {
                console.warn("Clap detector notice:", err);
            }
        }

        // 2. SPEECH RECOGNITION
        function setupSpeechRecognition() {
            if (!SpeechRecognition) {
                statusText.textContent = "Speech Recognition unsupported in this browser.";
                return;
            }

            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.continuous = !isMobile;
            recognition.interimResults = true;
            recognition.lang = 'en-IN';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                if (!sessionActive) {
                    try { recognition.stop(); } catch(e){}
                    return;
                }
                coreWrapper.className = 'core-wrapper listening';
                statusText.textContent = "Listening... (Speak to JARVIS)";
            };

            recognition.onresult = (event) => {
                if (!sessionActive || isProcessingOrSpeaking) return;

                let interim = '';
                let hasFinal = false;

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        accumulatedTranscript += text + ' ';
                        hasFinal = true;
                    } else {
                        interim += text;
                    }
                }

                const liveText = (accumulatedTranscript + interim).trim();
                if (liveText.length > 0) {
                    subtitleBox.textContent = `You: "${liveText}"`;
                }

                clearTimeout(speechTimeout);
                if (liveText.length > 1) {
                    const waitTime = hasFinal ? 850 : 1400;
                    speechTimeout = setTimeout(() => {
                        if (sessionActive && !isProcessingOrSpeaking && accumulatedTranscript.trim().length > 1) {
                            const query = accumulatedTranscript.trim();
                            accumulatedTranscript = '';
                            sendToJarvis(query);
                        }
                    }, waitTime);
                }
            };

            recognition.onerror = (event) => {
                console.warn("Recognition notice:", event.error);
                if (event.error === 'not-allowed') {
                    statusText.textContent = "Mic permission denied. Please allow microphone.";
                    sessionActive = false;
                    resetUI();
                } else if (event.error !== 'no-speech' && sessionActive && !isProcessingOrSpeaking) {
                    restartListeningWithDelay();
                }
            };

            recognition.onend = () => {
                if (sessionActive && !isProcessingOrSpeaking) {
                    const finalQuery = accumulatedTranscript.trim();
                    if (finalQuery.length > 1) {
                        accumulatedTranscript = '';
                        sendToJarvis(finalQuery);
                    } else {
                        restartListeningWithDelay();
                    }
                }
            };
        }

        // 3. ZERO-DELAY SESSION WAKE / TOGGLE
        function toggleSession(e) {
            if (e) e.stopPropagation();
            unlockAudioEngine();

            if (!sessionActive) {
                sessionActive = true;
                isProcessingOrSpeaking = true;
                accumulatedTranscript = '';
                updateControlsState(true);

                const rawSalutation = "{{ salutation|escapejs }}";
                const salutation = decodeHTML(rawSalutation) || "sir";
                const wakeGreeting = `Online and ready, ${salutation}.`;

                subtitleBox.textContent = `JARVIS: "${wakeGreeting}"`;
                coreWrapper.className = 'core-wrapper speaking';
                statusText.textContent = "JARVIS Transmitting...";

                setupSpeechRecognition();
                fetchWakeAudio(wakeGreeting);
            } else {
                shutdownSession();
            }
        }

        function fetchWakeAudio(text) {
            const formData = new FormData();
            formData.append('message', '__wake_greeting__');
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'assistance:jarvis_api' %}", {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.audio) {
                    speakReply(data.reply, data.audio, false);
                } else {
                    speakReply(text, null, false);
                }
            })
            .catch(() => {
                isProcessingOrSpeaking = false;
                if (sessionActive) startListening();
            });
        }

        function shutdownSession() {
            sessionActive = false;
            isProcessingOrSpeaking = false;
            accumulatedTranscript = '';
            clearTimeout(speechTimeout);
            updateControlsState(false);

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            jarvisAudio.pause();
            jarvisAudio.currentTime = 0;

            resetUI();
            statusText.textContent = isMobile 
                ? "Systems Offline. Tap Core to Activate." 
                : "Systems Offline. Double-Clap or Click Core to Activate.";
        }

        function startListening() {
            if (!sessionActive || isProcessingOrSpeaking) return;
            accumulatedTranscript = '';
            try {
                if (!recognition) setupSpeechRecognition();
                recognition.start();
            } catch (e) {
                try { recognition.stop(); } catch (err) {}
                setTimeout(() => { 
                    if (sessionActive && !isProcessingOrSpeaking) {
                        try { recognition.start(); } catch(err2) {}
                    }
                }, 100);
            }
        }

        function restartListeningWithDelay() {
            if (!sessionActive || isProcessingOrSpeaking) return;
            setTimeout(() => { startListening(); }, 150);
        }

        function resetUI() {
            coreWrapper.className = 'core-wrapper';
            statusText.textContent = sessionActive ? "Listening..." : (isMobile ? "Systems Offline. Tap Core to Activate." : "Systems Offline. Double-Clap or Click Core to Activate.");
            
            setTimeout(() => {
                if (!isProcessingOrSpeaking && !sessionActive) subtitleBox.textContent = "";
            }, 3000);
        }

        function sendToJarvis(message) {
            if (!sessionActive) return;

            isProcessingOrSpeaking = true;
            clearTimeout(speechTimeout);

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            coreWrapper.className = 'core-wrapper thinking';
            statusText.textContent = "JARVIS Thinking...";

            const formData = new FormData();
            formData.append('message', message);
            formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

            fetch("{% url 'assistance:jarvis_api' %}", {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.reply) {
                    const cleanReply = decodeHTML(data.reply);
                    subtitleBox.textContent = `JARVIS: "${cleanReply}"`;
                    speakReply(cleanReply, data.audio || null, data.shutdown || false);
                    refreshTaskList();
                } else {
                    isProcessingOrSpeaking = false;
                    restartListeningWithDelay();
                }
            })
            .catch(err => {
                console.error('API Error:', err);
                isProcessingOrSpeaking = false;
                if (sessionActive) restartListeningWithDelay();
            });
        }

        function speakReply(text, base64Audio = null, isShutdown = false) {
            const cleanText = decodeHTML(text).replace(/[*_~#`]/g, '').trim();

            if (base64Audio) {
                jarvisAudio.pause();
                jarvisAudio.src = "data:audio/mp3;base64," + base64Audio;
                jarvisAudio.currentTime = 0;
                
                coreWrapper.className = 'core-wrapper speaking';
                statusText.textContent = isShutdown ? "JARVIS Shutting Down..." : "JARVIS Transmitting...";

                jarvisAudio.play().catch(e => {
                    console.warn("Mobile audio playback issue:", e);
                });

                jarvisAudio.onended = () => {
                    if (isShutdown) {
                        shutdownSession();
                    } else {
                        setTimeout(() => {
                            isProcessingOrSpeaking = false;
                            if (sessionActive) {
                                resetUI();
                                startListening();
                            } else {
                                resetUI();
                            }
                        }, 120);
                    }
                };

                jarvisAudio.onerror = () => {
                    isProcessingOrSpeaking = false;
                    if (sessionActive) restartListeningWithDelay();
                };
                return;
            }

            isProcessingOrSpeaking = false;
            if (sessionActive) restartListeningWithDelay();
        }

        // Global background click initializes mic & clap detector without triggering activation
        stageContainer.addEventListener('click', (e) => {
            if (e.target.closest('#topNav')) return;
            if (!isMobile) initClapDetector();
        }, { once: true });
    </script>
</body>
</html>
